name: Cross-platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Upload Binaries
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl    # static binary, no glibc version issues on older distributions

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl   # static binary, no glibc version issues on older distributions

          - os: ubuntu-latest
            target: aarch64-linux-android

          - os: windows-latest
            target: x86_64-pc-windows-msvc # NB: on Windows two majors build-chains: x86_64-pc-windows-gnu & x86_64-pc-windows-msvc

          - os: macos-latest
            target: x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Setup Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27

      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk --locked

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      - name: Build musl release binary (Static PIE) #
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        env:
          RUSTFLAGS: "-C relocation-model=pie -C target-feature=+crt-static"
        run: cargo build --release --target=${{ matrix.target }}

      - name: Build Android release binary #API 21 = Android 5.0 Lollipop introduce aarch64 ABI
        if: matrix.target == 'aarch64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            --target ${{ matrix.target }} \
            --platform 21 \
            -- build --release

      - name: Build release binary
        if: matrix.target != 'x86_64-unknown-linux-musl' && matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'aarch64-linux-android'
        run: cargo build --release --target=${{ matrix.target }}

      - name: Rename output binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rsnake \
             dist/rsnake-${{ matrix.target }}

      - name: Rename output binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\rsnake.exe dist\rsnake-${{ matrix.target }}.exe

      # Inno Setup is not guaranteed on every Windows runner image: install it only if missing.
      # The installer version is read from Cargo.toml by the script itself (see installer/rsnake.iss).
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Find-Iscc {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -Last 1 -ExpandProperty FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DBinaryPath=target\${{ matrix.target }}\release\rsnake.exe" "/DOutputName=rsnake-${{ matrix.target }}-setup" installer\rsnake.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      # Installs silently, then runs the game the way the Start menu shortcut does (same target and
      # working directory): a broken installer must not be published.
      - name: Smoke test Windows installer (Start menu shortcut)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Start-Process "dist\rsnake-${{ matrix.target }}-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed with exit code $($setup.ExitCode)" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'rsnake.lnk'
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut not created: $lnk" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          # rsnake.exe has no icon of its own: the shortcut must point to the .ico installed next to it
          $icon = ($shortcut.IconLocation -split ',')[0]
          if (-not $icon -or -not (Test-Path $icon)) { throw "Start menu shortcut icon missing: '$($shortcut.IconLocation)'" }
          $expected = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          Push-Location $shortcut.WorkingDirectory
          $output = & $shortcut.TargetPath --version
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0 -or "$output" -notmatch [regex]::Escape($expected)) {
            throw "Installed rsnake failed from '$($shortcut.WorkingDirectory)' (exit $code, expected version $expected): $output"
          }
          Write-Host "Installed rsnake runs from the Start menu shortcut: $output"


      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
